spring.application.name=backend
server.port=8080

# Database connection (overridden by Docker Compose in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/app_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:strong_password}

# Automatically create/update tables from JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
